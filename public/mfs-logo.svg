<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240">
  <defs>
    <!-- Top Face Gradient (Bright Pure Gold) -->
    <linearGradient id="logoTopGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE895" />
      <stop offset="45%" stop-color="#F5D676" />
      <stop offset="100%" stop-color="#ECCB62" />
    </linearGradient>

    <!-- Left Face Gradient (Warm Mid Gold) -->
    <linearGradient id="logoLeftGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C158" />
      <stop offset="60%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#A57D13" />
    </linearGradient>

    <!-- Right Face Gradient (Deep Shadow Gold) -->
    <linearGradient id="logoRightGold" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B88B22" />
      <stop offset="50%" stop-color="#916B10" />
      <stop offset="100%" stop-color="#5E4304" />
    </linearGradient>
  </defs>

  <!-- Left: Hexa-Matrix Emblem (Exact Geometry) -->
  <g transform="translate(15, 12) scale(0.42)">
    <!-- Top Face (Hollow Chevron Surface) -->
    <polygon 
      points="102,167 256,78 410,167 358,197 256,138 154,197" 
      fill="url(#logoTopGold)" 
    />

    <!-- Left Outer Face -->
    <polygon 
      points="102,167 154,197 154,315 256,374 256,434 102,345" 
      fill="url(#logoLeftGold)" 
    />

    <!-- Right Outer Face -->
    <polygon 
      points="410,167 358,197 358,315 256,374 256,434 410,345" 
      fill="url(#logoRightGold)" 
    />

    <!-- Floating Suspended Core Cube in Empty Center -->
    <polygon 
      points="256,196 306,225 256,254 206,225" 
      fill="url(#logoTopGold)" 
    />

    <polygon 
      points="206,225 256,254 256,314 206,285" 
      fill="url(#logoLeftGold)" 
    />

    <polygon 
      points="256,254 306,225 306,285 256,314" 
      fill="url(#logoRightGold)" 
    />

    <!-- Separator Edges -->
    <line x1="102" y1="167" x2="154" y2="197" stroke="#121212" stroke-width="2" stroke-linecap="round" />
    <line x1="410" y1="167" x2="358" y2="197" stroke="#121212" stroke-width="2" stroke-linecap="round" />
    <line x1="256" y1="434" x2="256" y2="374" stroke="#121212" stroke-width="2" stroke-linecap="round" />

    <line x1="206" y1="225" x2="256" y2="254" stroke="#121212" stroke-width="1.5" stroke-linecap="round" />
    <line x1="306" y1="225" x2="256" y2="254" stroke="#121212" stroke-width="1.5" stroke-linecap="round" />
    <line x1="256" y1="254" x2="256" y2="314" stroke="#121212" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Right: Premium Typography -->
  <text x="235" y="82" font-family="'Poppins', 'Montserrat', sans-serif" font-weight="600" font-size="18" fill="url(#logoTopGold)" letter-spacing="4">MUHAMMAD SHEHROZ SULTAN</text>

  <line x1="235" y1="125" x2="265" y2="125" stroke="url(#logoTopGold)" stroke-width="3" />
  <text x="280" y="136" font-family="'Poppins', 'Inter', sans-serif" font-weight="800" font-size="38" fill="url(#logoTopGold)" letter-spacing="6">MFS GROWTH</text>
  <line x1="695" y1="125" x2="725" y2="125" stroke="url(#logoTopGold)" stroke-width="3" />

  <text x="235" y="178" font-family="'Poppins', 'Inter', sans-serif" font-weight="500" font-size="18" fill="#9FA0A7" letter-spacing="8">DIGITAL AGENCY</text>
</svg>
