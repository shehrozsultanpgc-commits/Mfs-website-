<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Outer Frame - Top Luminous Gold Surface -->
    <linearGradient id="goldTopFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEBA4" />
      <stop offset="40%" stop-color="#F3D979" />
      <stop offset="100%" stop-color="#E5C35E" />
    </linearGradient>

    <!-- Outer Frame - Left Facet Gold -->
    <linearGradient id="goldLeftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C35E" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#A47E1B" />
    </linearGradient>

    <!-- Outer Frame - Right Facet Gold -->
    <linearGradient id="goldRightFace" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BD9226" />
      <stop offset="60%" stop-color="#8F6B12" />
      <stop offset="100%" stop-color="#5C4204" />
    </linearGradient>

    <!-- Floating Center Cube - Top Facet -->
    <linearGradient id="cubeTopFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5BE" />
      <stop offset="50%" stop-color="#F7DF88" />
      <stop offset="100%" stop-color="#E8C765" />
    </linearGradient>

    <!-- Floating Center Cube - Left Facet -->
    <linearGradient id="cubeLeftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C765" />
      <stop offset="60%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9C7715" />
    </linearGradient>

    <!-- Floating Center Cube - Right Facet -->
    <linearGradient id="cubeRightFace" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B88E23" />
      <stop offset="60%" stop-color="#88640E" />
      <stop offset="100%" stop-color="#553C02" />
    </linearGradient>
  </defs>

  <!-- 1. FULL SOLID 100% OPAQUE MATTE BLACK BACKGROUND (No border lines, no white edges, pure solid) -->
  <rect x="0" y="0" width="512" height="512" fill="#050507" />

  <!-- 2. OUTER HOLLOW ISOMETRIC HEXAGON FRAME -->
  <!-- Outer Top Surface (Chevron Cap) -->
  <polygon 
    points="86,158 256,60 426,158 368,191 256,126 144,191" 
    fill="url(#goldTopFace)" 
  />

  <!-- Outer Left Facet -->
  <polygon 
    points="86,158 144,191 144,321 256,386 256,452 86,354" 
    fill="url(#goldLeftFace)" 
  />

  <!-- Outer Right Facet -->
  <polygon 
    points="426,158 368,191 368,321 256,386 256,452 426,354" 
    fill="url(#goldRightFace)" 
  />

  <!-- 3. INNER MATTE BLACK CAVITY -->
  <polygon 
    points="144,191 256,126 368,191 368,321 256,386 144,321" 
    fill="#050507" 
  />

  <!-- 4. FLOATING SUSPENDED CORE CUBE -->
  <!-- Center Cube Top Face -->
  <polygon 
    points="256,198 312,230 256,262 200,230" 
    fill="url(#cubeTopFace)" 
  />

  <!-- Center Cube Left Face -->
  <polygon 
    points="200,230 256,262 256,328 200,296" 
    fill="url(#cubeLeftFace)" 
  />

  <!-- Center Cube Right Face -->
  <polygon 
    points="256,262 312,230 312,296 256,328" 
    fill="url(#cubeRightFace)" 
  />

  <!-- 5. CRISP DELINEATION SEPARATOR EDGES -->
  <line x1="86" y1="158" x2="144" y2="191" stroke="#050507" stroke-width="3.5" stroke-linecap="round" />
  <line x1="426" y1="158" x2="368" y2="191" stroke="#050507" stroke-width="3.5" stroke-linecap="round" />
  <line x1="256" y1="452" x2="256" y2="386" stroke="#050507" stroke-width="3.5" stroke-linecap="round" />

  <line x1="200" y1="230" x2="256" y2="262" stroke="#050507" stroke-width="2.5" stroke-linecap="round" />
  <line x1="312" y1="230" x2="256" y2="262" stroke="#050507" stroke-width="2.5" stroke-linecap="round" />
  <line x1="256" y1="262" x2="256" y2="328" stroke="#050507" stroke-width="2.5" stroke-linecap="round" />
</svg>
